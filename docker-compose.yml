services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nubera_rrhh_db
    environment:
      POSTGRES_USER: nubera
      POSTGRES_PASSWORD: nubera_secret
      POSTGRES_DB: nubera_rrhh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_pgvector.sql:/docker-entrypoint-initdb.d/001_initial_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nubera -d nubera_rrhh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nubera_rrhh_backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://nubera:nubera_secret@db:5432/nubera_rrhh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nubera_rrhh_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
