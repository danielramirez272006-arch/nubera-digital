services:
  db:
    image: mysql:8.4
    container_name: nubera_rrhh_mysql
    environment:
      MYSQL_ROOT_PASSWORD: nubera_root_secret
      MYSQL_DATABASE: nubera_rrhh
      MYSQL_USER: nubera
      MYSQL_PASSWORD: nubera_secret
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unubera", "-pnubera_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nubera_rrhh_backend_node
    env_file:
      - .env.example
    environment:
      DATABASE_URL: mysql://nubera:nubera_secret@db:3306/nubera_rrhh
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./prompts:/app/prompts:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nubera_rrhh_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mysqldata:
